<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출석 · 수업료 관리</title>
  <link rel="icon" type="image/x-icon" href="assets/icon.ico">
  <link rel="icon" type="image/png" href="assets/icon-mark.png">
  <link rel="apple-touch-icon" href="assets/icon-mark.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 로딩 화면 -->
  <div id="loadingScreen" class="loading-screen">
    <p>불러오는 중...</p>
  </div>

  <!-- 로그인 화면 -->
  <div id="loginScreen" class="login-screen hidden">
    <div class="login-card">
      <img src="assets/logo.png" alt="울산언어심리운동센터" class="login-logo">
      <h1>출석 · 수업료 관리</h1>
      <p class="login-sub">선생님 로그인</p>
      <form id="loginForm">
        <label class="field">
          <span>아이디 (이름)</span>
          <select name="username" required id="loginUsername">
            <option value="">선택</option>
          </select>
        </label>
        <label class="field">
          <span>비밀번호 (4자리)</span>
          <input type="password" name="password" required pattern="[0-9]{4}" maxlength="4" inputmode="numeric" placeholder="0000">
        </label>
        <button type="submit" class="btn btn-primary btn-block">로그인</button>
      </form>
      <p class="login-hint">최초 비밀번호는 0000입니다. 관리자(신승오)가 변경할 수 있습니다.</p>
    </div>
  </div>

  <!-- 메인 앱 -->
  <div id="appScreen" class="hidden">
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <img src="assets/logo.png" alt="울산언어심리운동센터" class="brand-logo">
          <h1>출석 · 수업료 관리</h1>
        </div>
        <div class="user-bar">
          <span id="userLabel"></span>
          <button class="btn btn-sm" id="btnLogout">로그아웃</button>
        </div>
      </div>
      <nav class="nav-tabs">
        <button class="tab active" data-tab="attendance">오늘 출석</button>
        <button class="tab" data-tab="schedule">시간표</button>
        <button class="tab" data-tab="children">대상자 관리</button>
        <button class="tab" data-tab="fees">월 수업료 산정</button>
        <button class="tab" data-tab="monthlyAttendance">월 출석부</button>
        <button class="tab hidden" data-tab="settings" id="tabSettings">선생님 관리</button>
      </nav>
    </header>

    <main class="main">
      <section id="attendance" class="panel active">
        <div class="panel-header">
          <h2>출석 체크</h2>
          <div class="month-picker">
            <button class="btn btn-icon" id="attDatePrev">◀</button>
            <p class="today-label" id="todayLabel"></p>
            <button class="btn btn-icon" id="attDateNext">▶</button>
            <button class="btn btn-sm" id="attDateToday">오늘</button>
          </div>
        </div>
        <div class="makeup-add-row">
          <select id="makeupChildSelect">
            <option value="">+ 보강 인원 추가</option>
          </select>
        </div>
        <div id="attendanceList" class="attendance-list"></div>
        <p id="attendanceEmpty" class="empty-msg hidden">이 날 수업이 있는 대상자가 없습니다.</p>
      </section>

      <section id="schedule" class="panel">
        <div class="panel-header">
          <h2 id="scheduleTitle">시간표 (월~토)</h2>
          <div class="att-actions no-print">
            <button class="btn btn-sm" id="btnPrintSchedule">🖨 인쇄 / PDF로 저장</button>
          </div>
        </div>
        <div id="schedulePrintArea">
          <h3 id="schedulePrintTitle" class="print-only"></h3>
          <div id="scheduleScaleWrap">
            <div id="scheduleTableWrap"></div>
          </div>
        </div>
      </section>

      <section id="children" class="panel">
        <div class="panel-header">
          <h2>대상자 등록 · 관리</h2>
          <div class="children-header-actions">
            <select id="childrenSortSelect">
              <option value="recent">최신순</option>
              <option value="name">이름순 (ㄱㄴㄷ)</option>
            </select>
            <button class="btn btn-primary" id="btnNewChild">+ 새 대상자 등록</button>
          </div>
        </div>
        <div id="childrenList" class="children-list"></div>
      </section>

      <section id="fees" class="panel">
        <div class="panel-header">
          <h2>월 수업료 산정</h2>
          <div class="month-picker">
            <button class="btn btn-icon" id="prevMonth">◀</button>
            <span id="feeMonthLabel"></span>
            <button class="btn btn-icon" id="nextMonth">▶</button>
          </div>
        </div>
        <div class="fees-select-row">
          <button type="button" class="btn btn-sm" id="btnFeesSelectAll">전체 선택</button>
          <button type="button" class="btn btn-sm" id="btnFeesSelectNone">전체 해제</button>
          <div class="fees-child-checkboxes" id="feesChildCheckboxes"></div>
        </div>
        <div id="feesList" class="fees-list"></div>
      </section>

      <section id="monthlyAttendance" class="panel">
        <div class="panel-header">
          <h2>월 출석부</h2>
          <div class="month-picker">
            <button class="btn btn-icon" id="attPrevMonth">◀</button>
            <span id="attMonthLabel"></span>
            <button class="btn btn-icon" id="attNextMonth">▶</button>
          </div>
          <div class="att-actions no-print">
            <button class="btn btn-sm" id="btnPrintAttendance">🖨 인쇄 / PDF로 저장</button>
            <button class="btn btn-sm" id="btnExportAttendanceExcel">엑셀 다운로드</button>
          </div>
        </div>
        <div id="attendancePrintArea">
          <h3 id="attPrintTitle" class="print-only"></h3>
          <div id="monthlyAttendanceTableWrap"></div>
        </div>
      </section>

      <section id="settings" class="panel">
        <div class="panel-header">
          <h2>선생님 관리</h2>
        </div>
        <div class="teacher-add-row">
          <input type="text" id="newTeacherName" placeholder="새 선생님 이름">
          <label class="paid-check">
            <input type="checkbox" id="newTeacherIsAdmin">
            관리자 권한
          </label>
          <button type="button" class="btn btn-sm btn-primary" id="btnAddTeacher">+ 선생님 추가</button>
        </div>
        <div id="passwordList" class="password-list"></div>
      </section>
    </main>
  </div>

  <dialog id="childModal" class="modal">
    <form id="childForm" class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">새 대상자 등록</h3>
        <button type="button" class="btn-close" id="closeModal">×</button>
      </div>
      <div class="form-grid">
        <label class="field">
          <span>이름 *</span>
          <input type="text" name="name" required placeholder="대상자 이름">
        </label>
        <label class="field">
          <span>생년월일</span>
          <input type="date" name="birthDate">
        </label>
        <label class="field">
          <span>담당 선생님 *</span>
          <select name="teacher" required id="teacherSelect">
            <option value="">선택</option>
          </select>
        </label>
        <label class="field">
          <span>과목 *</span>
          <select name="subject" required>
            <option value="">선택</option>
          </select>
        </label>
        <fieldset class="field field-full">
          <legend>결제 구분 (중복 선택 가능)</legend>
          <div class="day-checkboxes" id="paymentTypeCheckboxes"></div>
        </fieldset>
        <div class="field field-full" id="developmentalSubField" hidden>
          <span>발달바우처 형별 (본인부담금)</span>
          <div id="developmentalSubOptions" class="radio-group"></div>
        </div>
        <div class="field field-full" id="infantSubField" hidden>
          <span>영유아 바우처 등급 (본인부담금)</span>
          <div id="infantSubOptions" class="radio-group"></div>
        </div>
        <fieldset class="field field-full">
          <legend>수업 요일 및 시간 * (요일별로 다르게 설정 가능)</legend>
          <div class="day-time-rows" id="dayTimeRows"></div>
        </fieldset>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="cancelModal">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="childHistoryModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="historyModalTitle">납부 내역</h3>
        <button type="button" class="btn-close" id="closeHistoryModal">×</button>
      </div>
      <div class="history-modal-body">
        <div class="month-picker">
          <button type="button" class="btn btn-icon" id="historyPrevYear">◀</button>
          <span id="historyYearLabel"></span>
          <button type="button" class="btn btn-icon" id="historyNextYear">▶</button>
        </div>
        <div id="historyTableWrap"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="closeHistoryModalFooter">닫기</button>
      </div>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
